# Pre-push security gate: build the hardened n8n image for linux/amd64 only,
# load it into the local Docker daemon and scan that image with Trivy. Nothing
# is pushed to a registry here.
#
# Used by publish.yml as a blocking job before the multi-arch push. Can also be
# started standalone from the Actions UI (workflow_dispatch) to re-scan without
# publishing.
name: scan-image

on:
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'n8n release to harden (tag n8n@<version>)'
        required: true
        default: '2.45.4'
      image_tag:
        description: 'Local tag for the scan image (never published)'
        required: true
        default: 'scan-local'
  workflow_call:
    inputs:
      n8n_version:
        description: 'n8n release to harden (tag n8n@<version>)'
        type: string
        required: true
      image_tag:
        description: 'Local tag for the scan image (never published)'
        type: string
        required: true

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  build-and-scan:
    name: Build amd64 + Trivy gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v7

      - name: Checkout n8n release
        uses: actions/checkout@v7
        with:
          repository: n8n-io/n8n
          ref: n8n@${{ inputs.n8n_version }}
          path: n8n-src
          fetch-depth: 1

      - name: Apply hardening diffs and Dockerfile
        working-directory: n8n-src
        run: |
          git apply ../pnpm/safe-overrides.diff
          git apply ../pnpm/majors-test-first.diff
          cp ../docker/images/n8n/Dockerfile docker/images/n8n/Dockerfile
          rm -rf docker/images/n8n/custom-nodes
          cp -r ../docker/images/n8n/custom-nodes docker/images/n8n/custom-nodes
          git diff --stat

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install dependencies
        working-directory: n8n-src
        # The catalog/overrides changed, so the lockfile must be regenerated
        # (CI=true makes pnpm default to --frozen-lockfile).
        run: pnpm install --no-frozen-lockfile

      - name: Build app and local amd64 image
        working-directory: n8n-src
        env:
          # Read by docker/docker-bake.hcl. No registry host in IMAGE_BASE_NAME:
          # this build only loads into the local daemon, it never pushes.
          PLATFORMS: linux/amd64
          IMAGE_BASE_NAME: n8nio/n8n
          IMAGE_TAG: ${{ inputs.image_tag }}
          N8N_VERSION: ${{ inputs.n8n_version }}
          N8N_RELEASE_TYPE: stable
        run: |
          node scripts/build-n8n.mjs
          docker buildx bake -f docker/docker-bake.hcl n8n --load

      - name: Setup Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v0.76.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan local image (gate)
        env:
          IMAGE_SRC: docker
          SBOM: '1'
          SEV_GATE: CRITICAL,HIGH
        run: ./scripts/scan.sh "n8nio/n8n:${{ inputs.image_tag }}"

      - name: Upload Trivy report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-amd64
          path: |
            reports/scan-*.json
            reports/sbom-*.cdx.json
          if-no-files-found: ignore
          retention-days: 30
